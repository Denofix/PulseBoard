name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - run: python -m pip install -r backend/requirements-dev.lock -e ./backend
      - run: python -m pytest backend/tests -q
      - run: python scripts/smoke_native.py
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose --env-file deploy/tunnel.env.example -f deploy/compose.tunnel.yaml config --quiet
      - run: docker compose up -d --build --wait
      - run: bash scripts/smoke_compose.sh
      - name: Verify the separate read-only preview stack
        env:
          TUNNEL_CORS_ORIGINS: '["https://pulseboard-ci.invalid"]'
        run: |
          docker compose --env-file deploy/tunnel.env.example -f deploy/compose.tunnel.yaml up -d --build --wait backend demo-service
          python3 scripts/check_public_demo.py http://127.0.0.1:8001/api --origin https://pulseboard-ci.invalid
      - name: Container logs on failure
        if: failure()
        run: |
          docker compose logs --no-color --tail=150
          docker compose --env-file deploy/tunnel.env.example -f deploy/compose.tunnel.yaml logs --no-color --tail=100
      - name: Stop test stack
        if: always()
        run: |
          docker compose --env-file deploy/tunnel.env.example -f deploy/compose.tunnel.yaml --profile tunnel down -v
          docker compose down -v
